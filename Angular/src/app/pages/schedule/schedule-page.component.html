<div class="schedule-root">
  <div class="toolbar">
    <div class="filters">
      <div class="filter">
        <ejs-dropdownlist
          [dataSource]="departmentOptions()"
          [fields]="departmentFields"
          placeholder="All Departments"
          [allowFiltering]="true"
          [sortOrder]="'Ascending'"
          [showClearButton]="true"
          [value]="departmentFilter()"
          width="200px"
          cssClass="dept-group-ddl"
          (change)="onDepartmentChange($event)">
        </ejs-dropdownlist>
      </div>
      <div class="filter">
        <ejs-dropdownlist
          [dataSource]="filteredProviders()"
          [fields]="providerFields"
          placeholder="All Providers"
          [allowFiltering]="true"
          [sortOrder]="'Ascending'"
          [showClearButton]="true"
          [value]="providerFilter()"
          width="200px"
          (change)="onProviderChange($event)">
        </ejs-dropdownlist>
      </div>
      <button ejs-button cssClass="e-primary" iconCss="e-icons e-plus" (click)="openNewAppointment()">
        New Appointment
      </button>
    </div>
  </div>

  @if (dataError(); as err) {
    <app-error-banner
      title="Schedule data could not be loaded"
      message="Schedule data could not be loaded — showing an empty planner. Click Retry to attempt loading again."
      (retry)="refreshAll()">
    </app-error-banner>
  }

  @if (scheduleLoading()) {
    <app-loading-state label="Loading schedule…"></app-loading-state>
  } @else if (dataError()) {
    <div class="empty-shell">
      <app-empty-state title="Empty schedule" description="No events to display."></app-empty-state>
    </div>
  } @else {
    <div class="schedule-wrap">
      @for (instanceKey of [scheduleInstanceKey()]; track instanceKey) {
      <ejs-schedule
        height="100%"
        [selectedDate]="selectedDate()"
        currentView="WorkWeek"
        [startHour]="'08:00'"
        [endHour]="'18:00'"
        [workHours]="{ highlight: true, start: '08:00', end: '17:00' }"
        [showQuickInfo]="false"
        [eventSettings]="eventSettings()"
        [group]="group()"
        (actionComplete)="onActionComplete($event)"
        (cellDoubleClick)="onCellDoubleClick($event)"
        (eventClick)="onEventClick($event)"
        (eventDoubleClick)="onEventDoubleClick($event)"
        (navigating)="onNavigating($event)"
        (eventRendered)="onEventRendered($event)"
        [enableAdaptiveUI]="isMobile"
        [timezone]="'UTC'" >
        <e-views>
          <e-view option="Day"></e-view>
          <e-view option="WorkWeek"></e-view>
          <e-view option="Month"></e-view>
          <e-view option="Agenda"></e-view>
          <e-view option="TimelineWeek"></e-view>
        </e-views>
        <e-resources>
          <e-resource
            field="ProviderId"
            title="Provider"
            name="Providers"
            [dataSource]="resourceDataSource()"
            textField="text"
            idField="id"
            [allowMultiple]="false">
          </e-resource>
        </e-resources>
      </ejs-schedule>
      }
    </div>
  }

  @if (dialogVisible()) {
    <app-new-appointment-dialog
      [visible]="dialogVisible()"
      [initialDateTime]="dialogDateTime()"
      [initialProviderId]="dialogProviderId()"
      [providers]="filteredProviders()"
      [departments]="departmentsState.data ?? []"
      (onClose)="dialogVisible.set(false)"
      (onSubmit)="handleDialogSubmit($event)">
    </app-new-appointment-dialog>
  }

  <app-appointment-detail-panel
    [isOpen]="detailOpen()"
    [appointmentId]="detailAppointmentId()"
    (close)="closeDetailPanel()"
    (changed)="onDetailChanged()">
  </app-appointment-detail-panel>
</div>
