@if (loading) {
  <app-loading-state label="Loading appointments…"></app-loading-state>
} @else if (error) {
  <app-error-banner title="Unable to load appointments" [message]="error" (retry)="retry()"></app-error-banner>
} @else {
  <div class="schedule-tab">
    <div class="card scheduler-card">
      <ejs-schedule
        height="100%"
        [selectedDate]="selectedDate"
        currentView="Week"
        [timezone]="'UTC'"
        [startHour]="'08:00'"
        [endHour]="'18:00'"
        [workHours]="{ highlight: true, start: '08:00', end: '17:00' }"
        [readonly]="true"
        [eventSettings]="eventSettings()"
        (eventRendered)="onEventRendered($event)">
        <e-views>
          <e-view option="Day"></e-view>
          <e-view option="Week"></e-view>
          <e-view option="Month"></e-view>
        </e-views>
      </ejs-schedule>
    </div>
  </div>
}
